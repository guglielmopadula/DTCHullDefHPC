# Pilot run: does the drag converge with gentler LTS settings and longer runs?
# Sourced after config.sh, so only these values change:
#
#     PIPE_CONFIG=pilot.conf ./submit.sh
#     PIPE_CONFIG=pilot.conf ./status.sh
#
# Result: $RUN_ROOT/results/summary.csv, column drag_drift (difference between
# the means of the two halves of the last N_AVG iterations).  Well below the
# spread you expect between hulls (~0.05 N): use these settings for the full run.
# The first run (tutorial settings, 4000 iterations) had a drift of 0.25 N.

RUN_ROOT="$SCRATCH/dtc_ffd_pilot"
BASE_MESH_DIR="$SCRATCH/dtc_ffd_morph/base_mesh"   # the main run's mesh, not meshed again

FIRST_SAMPLE=0
N_SAMPLES=4

FFD_SCALE=0.05                 # amplitude intended for the full run
END_TIME=8000
N_AVG=4000                     # the second half of the run
MAX_CO=3
MAX_ALPHA_CO=1
RDT_DAMPING=0.2
